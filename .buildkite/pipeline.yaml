---
common:
  agents:
    - &k8s-default
      queue: default
    - &k8s-large
      queue: default
      resource_class: large

  images:
    - &rust-zigbuild "messense/cargo-zigbuild:0.20.0"
    - &goreleaser "288761735648.dkr.ecr.us-east-1.amazonaws.com/mirror/docker.io/goreleaser/goreleaser:v2.15.4"

  plugins:
    - &gh-auth
      ssh://git@github.com/SafetyCulture/gh-authenticator-buildkite-plugin.git#v0.1.2:
        type: releaser
    - &ecr
      ecr#v2.12.0:
        login: true
        account-ids: "288761735648"
    - &dind-k8s
      kubernetes:
        sidecars:
          - image: 288761735648.dkr.ecr.us-east-1.amazonaws.com/mirror/docker.io/library/docker:dind
            command: ["dockerd-entrypoint.sh"]
            securityContext:
              privileged: true
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
    - &rust-step
      docker#v5.13.0:
        image: *rust-zigbuild
        shell: ["/bin/bash", "-eo", "pipefail", "-c"]
        environment:
          - "CARGO_HOME=/workdir/.cargo"
          - "CARGO_TARGET_DIR=/workdir/target"
        volumes:
          - ".:/workdir"
        workdir: /workdir
    - &goreleaser-step
      docker#v5.13.0:
        image: *goreleaser
        shell: false
        environment:
          - "GITHUB_TOKEN"
        volumes:
          - ".:/build"
        workdir: /build

steps:
  - label: ":rust: cargo test"
    key: tests
    command: cargo test --locked --no-default-features
    agents: *k8s-default
    env:
      DOCKER_HOST: "tcp://localhost:2375"
    timeout_in_minutes: 30
    plugins:
      - *ecr
      - *dind-k8s
      - *rust-step

  - label: ":rust: build release binaries"
    key: build
    depends_on: tests
    command: .buildkite/scripts/build-rust
    agents: *k8s-large
    artifact_paths:
      - "dist/**/*"
    env:
      DOCKER_HOST: "tcp://localhost:2375"
    timeout_in_minutes: 45
    plugins:
      - *ecr
      - *dind-k8s
      - *rust-step

  - label: ":abacus: Calculate Version"
    key: calculate-version
    command: "buildkite-agent meta-data set next-version $(.buildkite/scripts/auto-version)"
    agents: *k8s-default

  - label: ":goreleaser: snapshot"
    key: snapshot
    depends_on:
      - build
      - calculate-version
    command: ["release", "--snapshot", "--clean", "--skip=publish"]
    agents: *k8s-default
    env:
      DOCKER_HOST: "tcp://localhost:2375"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "dist/**/*"
      - *ecr
      - *dind-k8s
      - *goreleaser-step

  # Default branch: automatic release
  - label: ":hammer_and_wrench: Prepare Release"
    key: prepare-release
    depends_on:
      - snapshot
    if: build.branch == pipeline.default_branch
    command: .buildkite/scripts/prepare-release
    agents: *k8s-default
    plugins:
      - *gh-auth

  - label: ":goreleaser: Release"
    key: release
    depends_on: prepare-release
    if: build.branch == pipeline.default_branch
    command: ["release", "--clean"]
    agents: *k8s-default
    env:
      DOCKER_HOST: "tcp://localhost:2375"
    plugins:
      - *gh-auth
      - artifacts#v1.9.4:
          download:
            - "dist/**/*"
      - *ecr
      - *dind-k8s
      - *goreleaser-step

  - label: ":memo: Release Annotation"
    depends_on: release
    if: build.branch == pipeline.default_branch
    command: .buildkite/scripts/annotate-release
    agents: *k8s-default

  # Non-default branches: gated preview release
  - block: ":lock: Release Preview?"
    key: approve-preview-release
    depends_on:
      - snapshot
    if: build.branch != pipeline.default_branch

  - label: ":hammer_and_wrench: Prepare Preview Release"
    key: prepare-preview-release
    depends_on: approve-preview-release
    if: build.branch != pipeline.default_branch
    command: .buildkite/scripts/prepare-release
    agents: *k8s-default
    plugins:
      - *gh-auth

  - label: ":goreleaser: Preview Release"
    key: preview-release
    depends_on: prepare-preview-release
    if: build.branch != pipeline.default_branch
    command: ["release", "--clean"]
    agents: *k8s-default
    env:
      DOCKER_HOST: "tcp://localhost:2375"
    plugins:
      - *gh-auth
      - artifacts#v1.9.4:
          download:
            - "dist/**/*"
      - *ecr
      - *dind-k8s
      - *goreleaser-step

  - label: ":memo: Preview Release Annotation"
    depends_on: preview-release
    if: build.branch != pipeline.default_branch
    command: .buildkite/scripts/annotate-release
    agents: *k8s-default
