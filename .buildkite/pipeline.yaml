---
common:
  images:
    - &rust-zigbuild "messense/cargo-zigbuild:0.20.0"

  plugins:
    - &gh-auth
      ssh://git@github.com/SafetyCulture/gh-authenticator-buildkite-plugin.git#v0.1.2:
        type: releaser
    - &ecr
      ecr#v2.12.0:
        login: true
        account-ids: "288761735648"
    - &dind-k8s
      kubernetes:
        sidecars:
          - image: 288761735648.dkr.ecr.us-east-1.amazonaws.com/mirror/docker.io/library/docker:dind
            command: ["dockerd-entrypoint.sh"]
            securityContext:
              privileged: true
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
    - &rust-step
      docker#v5.13.0:
        image: *rust-zigbuild
        shell: ["/bin/bash", "-eo", "pipefail", "-c"]
        environment:
          - "GITHUB_TOKEN"
          - "CARGO_HOME=/workdir/.cargo"
          - "CARGO_TARGET_DIR=/workdir/target"
        volumes:
          - ".:/workdir"
        workdir: /workdir

env:
  GORELEASER_VERSION: "v2.14.3"

steps:
  - label: ":rust: cargo test"
    key: tests
    command: cargo test --locked --no-default-features
    env:
      DOCKER_HOST: "tcp://localhost:2375"
    timeout_in_minutes: 30
    plugins:
      - *ecr
      - *dind-k8s
      - *rust-step

  - label: ":goreleaser: snapshot"
    key: snapshot
    branches: "!main"
    depends_on: tests
    command: |
      curl -sSfL "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" \
        | tar -xzC /usr/local/bin goreleaser
      rustup target add \
        x86_64-unknown-linux-musl \
        aarch64-unknown-linux-musl \
        x86_64-apple-darwin \
        aarch64-apple-darwin
      goreleaser build --snapshot --clean
    artifact_paths:
      - dist/**/*
    env:
      DOCKER_HOST: "tcp://localhost:2375"
    timeout_in_minutes: 45
    plugins:
      - *ecr
      - *dind-k8s
      - *rust-step

  - wait: ~
    if: build.branch == "main"

  - label: ":goreleaser: release"
    key: release
    branches: "main"
    depends_on: tests
    command: |
      VERSION=$(tr -d '[:space:]' < ./VERSION.txt)
      if [[ -n "$(git ls-remote origin "refs/tags/${VERSION}")" ]]; then
        echo "Release ${VERSION} already exists. Skipping..."
        buildkite-agent annotate --style "warning" "No Release Created! VERSION.txt must be updated!"
        exit 1
      fi
      git tag "${VERSION}"
      curl -sSfL "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" \
        | tar -xzC /usr/local/bin goreleaser
      rustup target add \
        x86_64-unknown-linux-musl \
        aarch64-unknown-linux-musl \
        x86_64-apple-darwin \
        aarch64-apple-darwin
      goreleaser release --clean
      buildkite-agent annotate --style "success" "New Release Available: ${VERSION}"
    env:
      DOCKER_HOST: "tcp://localhost:2375"
    timeout_in_minutes: 60
    plugins:
      - *gh-auth
      - *ecr
      - *dind-k8s
      - *rust-step
