# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: sccache

builds:
  - id: sccache
    builder: prebuilt
    binary: sccache
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    prebuilt:
      path: "dist/{{ .Os }}_{{ .Arch }}/sccache"

archives:
  - id: sccache
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
  github:
    owner: SafetyCulture
    name: sccache

brews:
  - homepage: https://github.com/SafetyCulture/sccache
    description: "ccache-like compiler caching tool with multi-level cache support."
    repository:
      owner: SafetyCulture
      name: homebrew-tap
    download_strategy: GitHubPrivateRepositoryReleaseDownloadStrategy
    custom_require: "../custom_download_strategy"
    directory: Formula
    skip_upload: auto
    install: |
      bin.install "sccache"
    test: |
      system "#{bin}/sccache --version"
    commit_author:
      name: "SafetyTravis"
      email: "devops@safetyculture.io"
